# OCR API (KTP, NPWP, KK) + vLLM model server.
#
#   docker compose up -d --build
#   curl localhost:8070/health
#
# Only the API is published. vLLM is reachable only inside this compose network,
# like the 127.0.0.1-only setup of run_vllm.sh.
#
# Note: stop the screen-based services first (screen sessions "ocr" and "vllm");
# they use the same port 8070 and the GPU is too small for two vLLM instances.

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0}
    restart: unless-stopped
    ipc: host
    volumes:
      - ./model:/model:ro
    command:
      - /model
      - --served-model-name=${VLLM_MODEL:-qwen-ktp}
      - --host=0.0.0.0
      - --port=8071
      - --dtype=bfloat16
      - --gpu-memory-utilization=${VLLM_GPU_UTIL:-0.40}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-8192}
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-8}
      - --limit-mm-per-prompt={"image":1}
      - --mm-processor-kwargs={"min_pixels":200704,"max_pixels":2508800}
      # Eager mode as in run_vllm.sh (the host has no nvcc).
      # VLLM_EAGER=no-enforce-eager tries CUDA graphs if the image can compile them.
      - --${VLLM_EAGER:-enforce-eager}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8071/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s

  api:
    build: .
    image: ocr-api:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-8070}:8070"
    # Values come from .env (gitignored, see .env.example). Only variables the API reads
    # are listed, so vLLM-only settings never reach the API container.
    environment:
      INFERENCE_BACKEND: vllm
      VLLM_URL: http://vllm:8071
      VLLM_MODEL: ${VLLM_MODEL:-qwen-ktp}
      VLLM_TIMEOUT: ${VLLM_TIMEOUT:-120}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-512}
      MIN_PIXELS: ${MIN_PIXELS:-200704}
      MAX_PIXELS: ${MAX_PIXELS:-1003520}
      # Comma-separated keys for the X-API-Key header.
      API_KEYS: ${API_KEYS:-}
    depends_on:
      vllm:
        condition: service_healthy
